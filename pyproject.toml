[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melotts-mblt"
dynamic = ["version"]
description = "MeloTTS text-to-speech on Mobilint NPUs: English and Korean speech synthesis with a CLI and Gradio WebUI"
readme = "README.md"
authors = [{ name = "Mobilint Inc.", email = "tech-support@mobilint.com" }]
# Mobilint code is BSD-3-Clause; the MeloTTS-derived code keeps MyShell.ai's MIT license (melotts_mblt/LICENSE).
license = { text = "BSD-3-Clause AND MIT" }
requires-python = ">=3.10,<3.13"
keywords = ["tts", "text-to-speech", "melotts", "NPU", "inference", "mobilint", "mblt", "aries", "regulus"]
dependencies = [
    "mblt-npu-python>=0.1.0",
    "mobilint-qb-runtime>=1.4.0",
    # The Mobilint BERT used for prosody features loads through the transformers-mblt integration.
    "transformers-mblt>=0.0.0",
    "torch>=2.4.1",
    "numpy>=1.26.0",
    "huggingface-hub",
    "tqdm",
    "g2p_en>=2.1.0",
    "anyascii>=0.3.2",
    "jamo>=0.4.1",
    "g2pkk>=0.1.1",
    "unidic>=1.1.0",
    "python-mecab-ko>=1.3.7",
    "soundfile",
    "gradio",
    "click",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Home = "https://www.mobilint.com/"
Repository = "https://github.com/mobilint/MeloTTS-mblt"

[project.scripts]
melotts-mblt = "melotts_mblt.cli:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["melotts_mblt", "melotts_mblt.*"] } }

[tool.setuptools.dynamic]
version = { attr = "melotts_mblt.__version__" }

[tool.setuptools.package-data]
"melotts_mblt" = [
    "py.typed",
    "LICENSE",
    "text/cmudict.rep",
    "text/cmudict_cache.pickle",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-timeout",
    "build",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "requires_network: test downloads models, datasets, or other remote artifacts.",
    "requires_npu: test requires a configured Mobilint NPU runtime and device.",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# The MeloTTS modules were extracted verbatim from mblt-model-zoo (and upstream MeloTTS), where they were also
# excluded. The package entry points (`__init__.py`, `cli/`) and tests are linted.
extend-exclude = [
    "melotts_mblt/text",
    "melotts_mblt/api.py",
    "melotts_mblt/app.py",
    "melotts_mblt/commons.py",
    "melotts_mblt/download_utils.py",
    "melotts_mblt/main.py",
    "melotts_mblt/models.py",
    "melotts_mblt/split_utils.py",
    "melotts_mblt/utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
